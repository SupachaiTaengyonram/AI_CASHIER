{% extends 'aicashier/base.html' %}
{% block content %}
<div class="min-h-[85vh] swiss-grid-pattern flex items-center justify-center p-4 sm:p-6">
  <div class="bg-white border-4 border-black p-6 sm:p-10 w-full max-w-lg rounded-none shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
    <!-- Header Badge -->
    <div class="flex items-center justify-between border-b-2 border-black pb-4 mb-6">
      <div class="flex items-center gap-2">
        <span class="inline-block w-3 h-3 bg-swiss-accent"></span>
        <span class="text-xs font-mono font-bold tracking-widest uppercase">CATALOG // DELETE ACTION</span>
      </div>
      <span class="text-xs font-mono font-bold uppercase bg-swiss-accent text-white px-2 py-0.5">IRREVERSIBLE</span>
    </div>

    <!-- Title & Description -->
    <div class="mb-6">
      <h2 class="text-2xl sm:text-3xl font-black uppercase tracking-tight text-black mb-2">
        ลบ<span class="text-swiss-accent">รายการสินค้า</span>
      </h2>
      <p class="text-xs font-mono text-neutral-600 uppercase">
        CONFIRM PERMANENT RECORD DELETION FROM INVENTORY
      </p>
    </div>

    <!-- Warning Block -->
    <div class="border-2 border-black bg-swiss-muted p-4 mb-6">
      <p class="text-xs font-mono text-neutral-600 uppercase mb-1">TARGET PRODUCT:</p>
      <p class="text-lg font-black uppercase tracking-tight text-black">{{ object.name }}</p>
      <p class="text-xs font-mono text-neutral-500 mt-2">PRODUCT ID: #{{ object.id }}</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div class="grid grid-cols-2 gap-3">
        <button type="submit" class="w-full py-3 bg-swiss-accent hover:bg-black text-white font-mono font-bold text-xs uppercase tracking-widest border-2 border-black rounded-none transition-colors">
          ยืนยันการลบ
        </button>
        <a href="{% url 'product_manage' %}" class="w-full py-3 bg-white hover:bg-black hover:text-white text-black font-mono font-bold text-xs uppercase tracking-widest border-2 border-black rounded-none text-center transition-colors flex items-center justify-center">
          ยกเลิก
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
