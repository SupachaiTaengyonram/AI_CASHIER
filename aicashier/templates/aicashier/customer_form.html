{% extends 'aicashier/base.html' %}
{% block content %}
<div class="min-h-[85vh] swiss-grid-pattern py-8 px-4 flex items-center justify-center">
    <div class="max-w-xl w-full bg-white border-4 border-black p-6 sm:p-10 rounded-none shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
        <!-- Header -->
        <div class="flex items-center justify-between border-b-2 border-black pb-4 mb-6">
            <div class="flex items-center gap-2">
                <span class="inline-block w-3 h-3 bg-swiss-accent"></span>
                <span class="text-xs font-mono font-bold tracking-widest uppercase">CRM // CUSTOMER EDITOR</span>
            </div>
            <span class="text-xs font-mono font-bold uppercase bg-black text-white px-2 py-0.5">FORM-04</span>
        </div>

        <h1 class="text-2xl sm:text-3xl font-black uppercase tracking-tight text-black mb-2">
            บันทึก<span class="text-swiss-accent">ข้อมูลลูกค้า</span>
        </h1>
        <p class="text-xs font-mono text-neutral-600 uppercase mb-6">
            CUSTOMER PROFILE REGISTRATION & UPDATES
        </p>

        <form method="post" class="space-y-4 swiss-form">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="grid grid-cols-2 gap-3 pt-4 border-t-2 border-black">
                <button type="submit" class="w-full py-3 bg-black hover:bg-swiss-accent text-white font-mono font-bold text-xs uppercase tracking-widest border-2 border-black rounded-none transition-colors">
                    บันทึกข้อมูล
                </button>
                <a href="{% url 'customer_list' %}" class="w-full py-3 bg-white hover:bg-black hover:text-white text-black font-mono font-bold text-xs uppercase tracking-widest border-2 border-black rounded-none text-center transition-colors flex items-center justify-center">
                    ยกเลิก
                </a>
            </div>
        </form>
    </div>
</div>

<style>
.swiss-form p {
    margin-bottom: 1rem;
}
.swiss-form label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #000000;
    margin-bottom: 0.25rem;
}
.swiss-form input {
    width: 100% !important;
    background-color: #FFFFFF !important;
    color: #000000 !important;
    border: 2px solid #000000 !important;
    border-radius: 0px !important;
    padding: 10px 14px !important;
    font-family: inherit !important;
    font-size: 14px !important;
}
.swiss-form input:focus {
    outline: none !important;
    background-color: #F2F2F2 !important;
}
.swiss-form .helptext {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #666666;
    margin-top: 0.25rem;
}
</style>
{% endblock %}
